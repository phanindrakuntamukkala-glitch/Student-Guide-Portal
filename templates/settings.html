<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

href="{{ url_for('static', filename='css/style.css') }}">

<body>

<div class="dashboard-card">

<form>

<table class="settings-table">

<td>👤 Full Name</td>
<td>

value="KUNTAMUKKALA PHANINDRA CHOWDARY">
</td>
</tr>

<tr>
<td>📧 Email</td>
<td>
<input type="email"
value="phanindrakuntamukkala@gmail.com">
</td>
</tr>

<tr>
<td>📞 Mobile Number</td>
<td>
<input type="text"
value="7569462957">

</tr>

<tr>
<td>🔒 Current Password</td>
<td>
<input type="password"
placeholder="Enter current password">
</td>
</tr>

<tr>
<td>🔑 New Password</td>
<td>
<input type="password"
placeholder="Enter new password">

<option>English</option>
