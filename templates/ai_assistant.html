<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>AI Study Assistant</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="dashboard-card">

<h1>🤖 AI Study Assistant</h1>

<form method="POST">

<textarea
name="question"
rows="5"
placeholder="Ask anything about your subjects..."
required>
</textarea>

<br><br>

<button class="apply-btn">

Ask AI

</button>

</form>

{% if answer %}

<div class="ai-answer">

<h2>Answer</h2>

<p>{{ answer }}</p>

</div>

{% endif %}

<br>

<a href="/dashboard" class="search-btn">

⬅ Back to Dashboard

</a>

</div>

</body>

</html>
