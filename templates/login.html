<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Guide Portal | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="overlay">

<div class="login-card">

<!-- Logo -->

<div class="header">

<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

<h2>EduFlow Portal</h2>

<p>AI Powered University ERP System</p>

</div>

<!-- Login Form -->

<div class="login-body">

<form action="/login" method="POST">

<!-- Email -->

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
name="email"
placeholder="Enter Email"
required>

</div>

<!-- Password -->

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
name="password"
placeholder="Enter Password"
required>

<i
class="fa-solid fa-eye eye-icon"
id="togglePassword"></i>

</div>

<!-- Remember -->

<div class="remember">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>

<!-- Button -->

<button
type="submit"
class="login-btn">

LOGIN

</button>

</form>

<hr>

<div class="extra-links">

<a href="/">Home</a>

<span>|</span>

<a href="/register">Register</a>

</div>

</div>

<!-- Footer -->

<div class="footer">

© 2026 Student Guide Portal

<br>

Powered by Flask + AI

</div>

</div>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
